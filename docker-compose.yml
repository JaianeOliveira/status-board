services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: status-board-api
    restart: unless-stopped
    environment:
      PORT: 3333
    ports:
      - "${API_PORT:-3333}:3333"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
    container_name: status-board-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - api
